<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — SmartNotes</title>
  <meta name="description" content="Sign in to your SmartNotes student study dashboard.">

  <!-- CDNs -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="auth-header">
      <a class="brand-logo" href="index.html">
        <div class="brand-icon">
          <i class="fa-solid fa-book-open-reader"></i>
        </div>
        <div class="text-start">
          <div>SmartNotes</div>
          <div class="brand-tagline">Store. Understand. Revise.</div>
        </div>
      </a>
      <h2 class="auth-title">Welcome back 👋</h2>
      <p class="auth-subtitle">Sign in to access your study notes and AI revision tools</p>
    </div>

    <!-- Demo Credentials Notice -->
    <div class="demo-credentials-badge">
      <i class="fa-solid fa-circle-info"></i>
      <div class="demo-credentials-content">
        <strong>Demo Account:</strong><br>
        Email: <code>student@smartnotes.demo</code><br>
        Password: <code>student123</code>
        <div class="mt-1">
          <a href="#" id="fillDemoCredentials" style="text-decoration: underline; font-weight: 600;">
            Click to auto-fill credentials
          </a>
        </div>
      </div>
    </div>

    <!-- Login Form -->
    <form id="loginForm" novalidate>
      <div class="form-group mb-3">
        <label for="loginEmail" class="form-label">College Email Address</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fa-regular fa-envelope"></i></span>
          <input type="email" class="form-control" id="loginEmail" placeholder="student@college.edu" autocomplete="email" required>
        </div>
        <div class="form-error-msg" id="loginEmailError"></div>
      </div>

      <div class="form-group mb-3">
        <div class="d-flex justify-content-between align-items-center mb-1">
          <label for="loginPassword" class="form-label mb-0">Password</label>
          <a href="#" class="text-primary" style="font-size: 0.8rem;" onclick="showToast('Password reset link simulated. Check your inbox.', 'info'); return false;">Forgot password?</a>
        </div>
        <div class="input-group">
          <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
          <input type="password" class="form-control" id="loginPassword" placeholder="••••••••" autocomplete="current-password" required>
          <span class="input-group-text input-password-toggle" data-target="loginPassword" title="Toggle password visibility">
            <i class="fa-regular fa-eye"></i>
          </span>
        </div>
        <div class="form-error-msg" id="loginPasswordError"></div>
      </div>

      <div class="d-flex align-items-center justify-content-between mb-4">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="rememberMe" checked>
          <label class="form-check-label" for="rememberMe" style="font-size: 0.875rem;">
            Remember me
          </label>
        </div>
        <button class="icon-btn theme-toggle-btn" type="button" title="Toggle dark/light mode" style="width: 32px; height: 32px;">
          <i class="fa-solid fa-moon" style="font-size: 0.85rem;"></i>
        </button>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2 justify-content-center" id="loginSubmitBtn">
        <i class="fa-solid fa-right-to-bracket"></i> Sign In to Dashboard
      </button>
    </form>

    <div class="text-center mt-4" style="font-size: 0.9rem;">
      <span class="text-muted">Don't have an account yet?</span>
      <a href="register.html" class="font-weight-600 text-primary ms-1">Create an account</a>
    </div>

    <div class="text-center mt-3">
      <a href="index.html" class="text-muted" style="font-size: 0.825rem;">
        <i class="fa-solid fa-arrow-left me-1"></i> Back to Homepage
      </a>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
