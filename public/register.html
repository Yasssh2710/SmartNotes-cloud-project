<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration — SmartNotes</title>
  <meta name="description" content="Register your SmartNotes student account for revision and cloud study management.">

  <!-- CDNs -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
</head>
<body class="auth-page">

  <div class="auth-card" style="max-width: 520px;">
    <div class="auth-header">
      <a class="brand-logo" href="index.html">
        <div class="brand-icon">
          <i class="fa-solid fa-book-open-reader"></i>
        </div>
        <div class="text-start">
          <div>SmartNotes</div>
          <div class="brand-tagline">Store. Understand. Revise.</div>
        </div>
      </a>
      <h2 class="auth-title">Create Student Account 🎓</h2>
      <p class="auth-subtitle">Join thousands of engineering students revising smarter</p>
    </div>

    <!-- Registration Form -->
    <form id="registerForm" novalidate>
      <div class="form-group mb-3">
        <label for="regName" class="form-label">Full Name</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fa-regular fa-user"></i></span>
          <input type="text" class="form-control" id="regName" placeholder="e.g. Alex Student" required>
        </div>
        <div class="form-error-msg"></div>
      </div>

      <div class="form-group mb-3">
        <label for="regEmail" class="form-label">College Email Address</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fa-regular fa-envelope"></i></span>
          <input type="email" class="form-control" id="regEmail" placeholder="student@college.edu" required>
        </div>
        <div class="form-error-msg"></div>
      </div>

      <div class="form-group mb-3">
        <label for="regCollege" class="form-label">College / University Name</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fa-solid fa-building-columns"></i></span>
          <input type="text" class="form-control" id="regCollege" placeholder="e.g. AISSMS College of Engineering" required>
        </div>
        <div class="form-error-msg"></div>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <div class="form-group">
            <label for="regPassword" class="form-label">Password</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
              <input type="password" class="form-control" id="regPassword" placeholder="Min 6 chars" required>
            </div>
            <div class="form-error-msg"></div>
          </div>
        </div>
        <div class="col-md-6 mb-3">
          <div class="form-group">
            <label for="regConfirmPassword" class="form-label">Confirm Password</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fa-solid fa-shield-halved"></i></span>
              <input type="password" class="form-control" id="regConfirmPassword" placeholder="Re-enter" required>
            </div>
            <div class="form-error-msg"></div>
          </div>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2 justify-content-center mt-2" id="registerSubmitBtn">
        <i class="fa-solid fa-user-plus"></i> Create Account
      </button>
    </form>

    <div class="text-center mt-4" style="font-size: 0.9rem;">
      <span class="text-muted">Already have an account?</span>
      <a href="login.html" class="font-weight-600 text-primary ms-1">Sign In</a>
    </div>

    <div class="text-center mt-3">
      <a href="index.html" class="text-muted" style="font-size: 0.825rem;">
        <i class="fa-solid fa-arrow-left me-1"></i> Back to Homepage
      </a>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
